# ── 基础 ────────────────────────────────────────────────
# 滚轮滚动窗口历史（pi 未启用鼠标报告 → tmux 捕获滚轮进 copy-mode）
set -g mouse on
# 透传组合修饰键序列（pi 的 Ctrl+Shift+R 等需 kitty/CSI-u/modifyOtherKeys；tmux 3.4+）
set -g extended-keys always
# tmux 3.7+：启用 kitty 键盘协议（csi-u）——消除 "extended-keys-format is xterm" 警告并增强修饰键透传。
# 老版本 tmux（<3.7）不认识 extended-keys-format 选项，if-shell 按版本条件设置，不影响其他环境。
if-shell '[ "$(tmux -V | cut -d" " -f2 | tr -d a-z)" \> 3.6 ]' 'set -g extended-keys-format csi-u'
# 滚动容量
set -g history-limit 20000
# 正确渲染 pi 的 256 色 TUI
set -g default-terminal "tmux-256color"
# ESC 序列响应更快（pi 键盘序列依赖）
set -g escape-time 10

# ── 键位 ────────────────────────────────────────────────
# 前缀键改 Ctrl+a（与 alacritty-tmux-setup.md 一致）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 时区：北京时间（#() 子命令继承此 TZ；%H:%M 是 tmux 内部 strftime 不受影响，时间已改用 date 子进程）
setenv -g TZ Asia/Shanghai

# 状态栏：左=前缀指示器+会话名（窗口列表由 tmux 默认段渲染）；右=时钟+负载+内存
set -g status-left "#{?client_prefix,#[reverse]#[fg=yellow] C-a #[default],}#[fg=white]#S "
# 右侧状态栏：读状态文件（tmux #() 有极短执行超时，慢脚本直出会被杀，故用 文件+cat 模式）
# 数据由 status-loop.sh 每 3 秒 set-option 更新（时间|负载|内存，异常自动着色）。
# 不用 #() 命令替换：Termux 的 tmux 3.7b 中 #() 不执行（实测输出为空）。
set -g status-right ""
set -g status-right-length 60

# ── 插件（tpm 管理，见 alacritty-tmux-setup.md）─────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 快照快捷键（resurrect 默认：prefix C-s 保存 / prefix C-r 恢复）
# 即 Ctrl+a C-s 保存 / Ctrl+a C-r 恢复

# continuum：每 15 分钟自动保存，启动自动恢复
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# tpm 初始化（必须放在文件末尾）
run '~/.tmux/plugins/tpm/tpm'

# 状态栏数据循环刷新（flock 幂等，重复 source 安全）
run-shell '~/.pi/tmux/status-loop.sh >/dev/null 2>&1 &'

# ── 右键菜单中文化（功能与 tmux 3.4 默认一致，仅标签译中文）────────────────
# 覆盖默认 MouseDown3* 绑定（右键点击 pane/status/会话名 及 Alt+右键变体）
bind-key -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},回到顶部,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},回到底部,}" > { send-keys -X history-bottom } '' "#{?mouse_word,搜索 #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward "#{q:mouse_word}" } "#{?mouse_word,输入 #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,复制 #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,复制整行,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,输入链接 #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,复制链接 #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "左右分屏" h { split-window -h } "上下分屏" v { split-window -v } '' "#{?#{>:#{window_panes},1},,-}向上交换" u { swap-pane -U } "#{?#{>:#{window_panes},1},,-}向下交换" d { swap-pane -D } "#{?pane_marked_set,,-}与标记交换" s { swap-pane } '' "终止窗格" X { kill-pane } "重新启动" R { respawn-pane -k } "#{?pane_marked,取消标记,标记}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,取消缩放,缩放}" z { resize-pane -Z } }
bind-key -T root MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}向左交换" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}向右交换" r { swap-window -t :+1 } "#{?pane_marked_set,,-}与标记交换" s { swap-window } '' "终止窗口" X { kill-window } "重新启动" R { respawn-window -k } "#{?pane_marked,取消标记,标记}" m { select-pane -m } "重命名" n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "在其后新建" w { new-window -a } "在末尾新建" W { new-window }
bind-key -T root MouseDown3StatusLeft display-menu -T "#[align=centre]#{session_name}" -t = -x M -y W "下一个会话" n { switch-client -n } "上一个会话" p { switch-client -p } '' "重新编号" N { move-window -r } "重命名" n { command-prompt -I "#S" { rename-session "%%" } } '' "新建会话" s { new-session } "新建窗口" w { new-window }
bind-key -T root M-MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},回到顶部,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},回到底部,}" > { send-keys -X history-bottom } '' "#{?mouse_word,搜索 #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward "#{q:mouse_word}" } "#{?mouse_word,输入 #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,复制 #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,复制整行,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,输入链接 #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,复制链接 #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "左右分屏" h { split-window -h } "上下分屏" v { split-window -v } '' "#{?#{>:#{window_panes},1},,-}向上交换" u { swap-pane -U } "#{?#{>:#{window_panes},1},,-}向下交换" d { swap-pane -D } "#{?pane_marked_set,,-}与标记交换" s { swap-pane } '' "终止窗格" X { kill-pane } "重新启动" R { respawn-pane -k } "#{?pane_marked,取消标记,标记}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,取消缩放,缩放}" z { resize-pane -Z } }
bind-key -T root M-MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}向左交换" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}向右交换" r { swap-window -t :+1 } "#{?pane_marked_set,,-}与标记交换" s { swap-window } '' "终止窗口" X { kill-window } "重新启动" R { respawn-window -k } "#{?pane_marked,取消标记,标记}" m { select-pane -m } "重命名" n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "在其后新建" w { new-window -a } "在末尾新建" W { new-window }
bind-key -T root M-MouseDown3StatusLeft display-menu -T "#[align=centre]#{session_name}" -t = -x M -y W "下一个会话" n { switch-client -n } "上一个会话" p { switch-client -p } '' "重新编号" N { move-window -r } "重命名" n { command-prompt -I "#S" { rename-session "%%" } } '' "新建会话" s { new-session } "新建窗口" w { new-window }
