# ── 基础 ────────────────────────────────────────────────
# 滚轮滚动窗口历史（pi 未启用鼠标报告 → tmux 捕获滚轮进 copy-mode）
set -g mouse on
# 透传组合修饰键序列（pi 的 Ctrl+Shift+R 等需 kitty/CSI-u/modifyOtherKeys；tmux 3.4+）
set -g extended-keys always
# 滚动容量
set -g history-limit 20000
# 正确渲染 pi 的 256 色 TUI
set -g default-terminal "tmux-256color"
# ESC 序列响应更快（pi 键盘序列依赖）
set -g escape-time 10

# ── 键位 ────────────────────────────────────────────────
# 前缀键改 Ctrl+a（与 alacritty-tmux-setup.md 一致）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 时区：北京时间（#() 子命令继承此 TZ；%H:%M 是 tmux 内部 strftime 不受影响，时间已改用 date 子进程）
setenv -g TZ Asia/Shanghai

# 状态栏：左=前缀指示器+会话名（窗口列表由 tmux 默认段渲染）；右=时钟+负载+内存
set -g status-left "#{?client_prefix,#[reverse]#[fg=yellow] C-a #[default],}#[fg=white]#S "
# 右侧状态栏：读状态文件（tmux #() 有极短执行超时，慢脚本直出会被杀，故用 文件+cat 模式）
# 数据由 status-loop.sh 每 3 秒刷新 /tmp/tmux-status.txt（时间|负载|内存，异常自动着色）
set -g status-right "#(cat /tmp/tmux-status.txt)"
set -g status-right-length 60

# ── 插件（tpm 管理，见 alacritty-tmux-setup.md）─────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 快照快捷键（resurrect 默认：prefix C-s 保存 / prefix C-r 恢复）
# 即 Ctrl+a C-s 保存 / Ctrl+a C-r 恢复

# continuum：每 15 分钟自动保存，启动自动恢复
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# tpm 初始化（必须放在文件末尾）
run '~/.tmux/plugins/tpm/tpm'

# 状态栏数据循环刷新（flock 幂等，重复 source 安全）
run-shell '~/.pi/tmux/status-loop.sh >/dev/null 2>&1 &'
